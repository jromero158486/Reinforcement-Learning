<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Robot Bípedo – Control RL</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      text-align: center;
      padding: 40px;
    }

    h1 {
      margin-bottom: 10px;
    }

    button {
      font-size: 18px;
      padding: 12px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .connect { background: #22c55e; }
    .go { background: #3b82f6; }
    .stop { background: #ef4444; }

    input {
      font-size: 16px;
      width: 80px;
      text-align: center;
      margin-left: 5px;
    }

    .panel {
      margin-top: 30px;
      padding: 20px;
      background: #1e293b;
      border-radius: 12px;
      display: inline-block;
    }
  </style>
</head>

<body>

  <h1>🤖 Robot Bípedo – Reinforcement Learning</h1>
  <p>Control por Serial (Arduino Nano)</p>

  <button class="connect" onclick="connect()">🔌 Conectar</button>

  <div class="panel">
    <h3>Modo Aprendizaje</h3>

    <div>
      Pasos:
      <input id="steps" type="number" value="10" min="1">
      <button class="go" onclick="startRL()">▶ Iniciar RL</button>
    </div>

    <div>
      <button class="stop" onclick="stopRobot()">⛔ STOP</button>
    </div>
  </div>

  <script>
    let port;
    let writer;

    async function connect() {
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });

        writer = port.writable.getWriter();
        alert("✅ Conectado al Arduino");
      } catch (e) {
        alert("❌ Error al conectar");
        console.error(e);
      }
    }

    async function send(cmd) {
      if (!writer) {
        alert("Primero conecta el Arduino");
        return;
      }
      const data = new TextEncoder().encode(cmd + "\n");
      await writer.write(data);
    }

    function startRL() {
      const n = document.getElementById("steps").value;
      send("F" + n);
    }

    function stopRobot() {
      send("STOP");
    }
  </script>

</body>
</html>
